<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Saved">
<title>Saved</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#0f172a;--card:#1e293b;--line:#334155;--mute:#94a3b8;--saved:#4ade80;--sold:#fbbf24;--total:#a78bfa;--acc:#a78bfa}
body{font-family:-apple-system,system-ui,sans-serif;margin:0;background:var(--bg);color:#f1f5f9;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.w{max-width:480px;margin:auto;padding:16px}
input,select,button{font-size:17px;padding:12px;border-radius:10px;border:0;width:100%;box-sizing:border-box;margin-top:6px;font-family:inherit}
.seg{display:flex;background:var(--card);border-radius:12px;padding:4px;gap:4px}
.seg button{margin:0;background:transparent;color:#cbd5e1;font-weight:600;padding:10px}
.seg button.on{background:var(--line);color:#fff}
.big{font-size:44px;font-weight:800;color:var(--acc);text-align:center;margin:14px 0 2px}
.sub{text-align:center;color:var(--mute);font-size:14px}
.split{text-align:center;font-size:14px;margin-top:4px;font-weight:600}
.card{background:var(--card);border-radius:14px;padding:12px;margin:10px 0}
.k{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;font-size:14px;color:#cbd5e1}
.k b{display:block;font-size:18px;color:var(--acc);margin-top:2px}
.all{text-align:center;color:var(--mute);font-size:13px;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:15px}
th{color:var(--mute);font-weight:500;font-size:13px;text-align:right;padding:6px 4px}
th:first-child,td:first-child{text-align:left}
td{text-align:right;padding:9px 4px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
td:first-child{color:#cbd5e1}
.cs{color:var(--saved)}.co{color:var(--sold)}.ct{color:var(--total);font-weight:700}
.row{display:flex;gap:8px}.row>*{flex:1}
.tab{background:var(--line);color:#fff;font-weight:700}
.tab.on.s{background:var(--saved);color:#04210f}.tab.on.o{background:var(--sold);color:#2a1d00}
.mini{background:transparent;border:1px solid var(--line);color:#cbd5e1;padding:8px;font-size:15px}
.mini.on{background:var(--line);color:#fff}
.go{background:var(--saved);color:#04210f;font-weight:700}.go.sold{background:var(--sold);color:#2a1d00}
.head{display:flex;justify-content:space-between;align-items:center}
.head .seg{padding:2px}.head .seg button{font-size:13px;padding:6px 10px}
.r{display:flex;align-items:center;gap:6px;margin:4px 0}
.lb{width:34px;color:var(--mute);font-size:13px}.val{width:70px;text-align:right;color:var(--mute);font-size:13px}
.track{flex:1;display:flex;height:20px;border-radius:4px;overflow:hidden}
.bs{background:var(--saved)}.bo{background:var(--sold)}
.legend{gap:14px;font-size:13px;color:var(--mute);margin-top:6px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
li{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
ul{list-style:none;padding:0;margin:0}small{color:var(--mute)}
summary{color:var(--mute);font-size:14px}
</style></head><body><div class="w">

<div class="seg"><button id="v_total" onclick="setView('total')">Total</button><button id="v_saved" onclick="setView('saved')">Saved</button><button id="v_sold" onclick="setView('sold')">Sold</button></div>
<div class="big" id="tot">CHF 0.00</div>
<div class="sub" id="lbl"></div>
<div class="split" id="split"></div>

<div class="card" id="statsCard"><div class="k"><div>Today<b id="sDay">0</b></div><div>Week<b id="sWeek">0</b></div><div>Month<b id="sMonth">0</b></div><div>Year<b id="sYear">0</b></div></div>
<div class="all" id="sAll"></div></div>

<div class="card" id="totalCard"><table><thead><tr><th></th><th class="cs">Saved</th><th class="co">Sold</th><th class="ct">Total</th></tr></thead><tbody id="tBody"></tbody></table></div>

<div class="card" id="entryCard">
<small id="entryTitle"></small>
<input id="note" placeholder="What did you skip/change?">
<div id="savedBox">
 <div class="row"><button class="mini on" id="t1" onclick="setMode(1)">Amount</button><button class="mini" id="t2" onclick="setMode(2)">Was → Now</button></div>
 <div id="m1"><input id="amt" type="number" step="0.05" inputmode="decimal" placeholder="Amount saved"></div>
 <div class="row" id="m2" style="display:none"><input id="wasIn" type="number" inputmode="decimal" placeholder="Was"><input id="nowIn" type="number" inputmode="decimal" placeholder="Now"></div>
</div>
<div id="soldBox" style="display:none">
 <input id="soldAmt" type="number" step="0.05" inputmode="decimal" placeholder="Amount received (after fees)">
 <select id="platform"><option>Ricardo</option><option>Facebook Marketplace</option><option>Facebook group</option><option>Tutti</option><option>Other</option></select>
</div>
<div class="row"><select id="cur"><option>CHF</option><option>EUR</option></select><button id="goBtn" class="go" onclick="addEntry()">+ Add</button></div>
</div>

<div class="card">
<div class="head"><small id="chartTitle">Last 7 days</small><div class="seg"><button id="sp_days" onclick="setSpan('days')">7 days</button><button id="sp_months" onclick="setSpan('months')">12 months</button></div></div>
<div id="chart"></div>
<div class="legend" id="legend" style="display:flex"><span><i class="dot" style="background:var(--saved)"></i>Saved</span><span><i class="dot" style="background:var(--sold)"></i>Sold</span></div>
</div>

<div class="card"><small id="listTitle">Entries (tap one to delete)</small><ul id="list"></ul></div>

<details class="card"><summary>Settings (once per device)</summary>
<input id="cfgUrl" placeholder="Supabase Project URL">
<input id="cfgKey" placeholder="Supabase publishable key">
<div class="row"><input id="cfgFx" type="number" step="0.01" inputmode="decimal" placeholder="EUR→CHF rate"><button class="go" onclick="saveCfg()">Save</button></div>
</details>
<div class="sub" id="status"></div>
</div><script>
let sb=null,rows=[],kind='saved',mode=1;
const $=id=>document.getElementById(id);
const get=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const put=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let view=get('view')||'total',span=get('span')||'days';
const f=n=>Number(n).toLocaleString('de-CH',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const K=r=>r.kind||'saved',V=r=>+r.amount_chf||0;
const LBL={total:'extra money this month (saved + sold)',saved:'saved this month by not spending',sold:'earned this month by selling'};
function fx(){return parseFloat(get('fx')||'0.94')}
function setView(v){view=v;put('view',v);if(v!='total')setKind(v);draw()}
function setSpan(s){span=s;put('span',s);draw()}
function setMode(n){mode=n;$('m1').style.display=n==1?'block':'none';$('m2').style.display=n==2?'flex':'none';$('t1').className='mini'+(n==1?' on':'');$('t2').className='mini'+(n==2?' on':'')}
function setKind(k){kind=k;$('savedBox').style.display=k=='saved'?'block':'none';$('soldBox').style.display=k=='sold'?'block':'none';
 $('entryTitle').textContent=k=='saved'?'Log money saved':'Log a sale';$('goBtn').textContent=k=='saved'?'+ Add saving':'+ Add sale';
 $('goBtn').className='go'+(k=='sold'?' sold':'');$('note').placeholder=k=='saved'?'What did you skip/change?':'What did you sell?'}
function saveCfg(){put('url',$('cfgUrl').value.trim());put('key',$('cfgKey').value.trim());if($('cfgFx').value)put('fx',$('cfgFx').value);init()}
async function init(){
 $('cfgUrl').value=get('url')||'';$('cfgKey').value=get('key')||'';$('cfgFx').value=get('fx')||'0.94';
 if(get('url')&&get('key')){
  try{sb=supabase.createClient(get('url'),get('key'));
   const{data,error}=await sb.from('savings').select('*').order('created_at',{ascending:false});
   if(error){sb=null;$('status').textContent='Not connected: '+error.message}else{rows=data;$('status').textContent='Connected ✓ (saved online)'}
  }catch(e){sb=null;$('status').textContent='Not connected: '+e.message}
 }else{rows=JSON.parse(get('rows')||'[]');$('status').textContent='Not connected yet: open Settings'}
 draw()}
async function addEntry(){
 let s,was=null,now=null,platform=null;
 if(kind=='saved'){if(mode==1)s=parseFloat($('amt').value);else{was=parseFloat($('wasIn').value);now=parseFloat($('nowIn').value);s=was-now}}
 else{s=parseFloat($('soldAmt').value);platform=$('platform').value}
 if(!(s>0))return alert(kind=='saved'?'Enter a positive saving':'Enter the amount you received');
 const c=$('cur').value;
 const r={created_at:new Date().toISOString(),kind,amount:+s.toFixed(2),currency:c,amount_chf:+(c=='EUR'?s*fx():s).toFixed(2),note:$('note').value||'',was_price:was,now_price:now,platform};
 if(sb){const{data,error}=await sb.from('savings').insert(r).select();
  if(error)return alert(/kind|platform/.test(error.message)?'Database not upgraded yet: run update.sql in Supabase (manual, Part 5).':error.message);
  rows.unshift(data[0])}
 else{r.id=Date.now();rows.unshift(r);put('rows',JSON.stringify(rows))}
 ['amt','wasIn','nowIn','soldAmt','note'].forEach(i=>$(i).value='');
 draw()}
async function del(id){if(!confirm('Delete this entry?'))return;
 if(sb){const{error}=await sb.from('savings').delete().eq('id',id);if(error)return alert(error.message)}
 rows=rows.filter(r=>String(r.id)!==String(id));if(!sb)put('rows',JSON.stringify(rows));draw()}
function draw(){
 document.documentElement.style.setProperty('--acc','var(--'+view+')');
 ['total','saved','sold'].forEach(v=>$('v_'+v).className=v==view?'on':'');
 ['days','months'].forEach(v=>$('sp_'+v).className=v==span?'on':'');
 const list=view=='total'?rows:rows.filter(r=>K(r)==view);
 const sv=rows.filter(r=>K(r)=='saved'),so=rows.filter(r=>K(r)=='sold');
 const n=new Date(),day=new Date(n.getFullYear(),n.getMonth(),n.getDate());
 const wk=new Date(day);wk.setDate(day.getDate()-((day.getDay()+6)%7));
 const mo=new Date(n.getFullYear(),n.getMonth(),1),yr=new Date(n.getFullYear(),0,1);
 const sum=(l,a,b)=>l.filter(r=>{const t=new Date(r.created_at);return t>=a&&(!b||t<b)}).reduce((x,r)=>x+V(r),0);
 $('tot').textContent='CHF '+f(sum(list,mo));$('lbl').textContent=LBL[view];
 $('split').innerHTML=view=='total'?`<span style="color:var(--saved)">Saved ${f(sum(sv,mo))}</span> &nbsp;+&nbsp; <span style="color:var(--sold)">Sold ${f(sum(so,mo))}</span>`:'';
 $('sDay').textContent=f(sum(list,day));$('sWeek').textContent=f(sum(list,wk));$('sMonth').textContent=f(sum(list,mo));$('sYear').textContent=f(sum(list,yr));
 $('sAll').textContent='All time: CHF '+f(sum(list,new Date(0)));
 const T=view=='total';$('entryCard').style.display=T?'none':'block';$('statsCard').style.display=T?'none':'block';$('totalCard').style.display=T?'block':'none';
 $('tBody').innerHTML=[['Today',day],['Week',wk],['Month',mo],['Year',yr],['All time',new Date(0)]].map(([l,d])=>{const a=sum(sv,d),b=sum(so,d);return `<tr><td>${l}</td><td class="cs">${f(a)}</td><td class="co">${f(b)}</td><td class="ct">${f(a+b)}</td></tr>`}).join('');
 const B=[];
 if(span=='days'){for(let i=6;i>=0;i--){const s=new Date(day);s.setDate(day.getDate()-i);const e=new Date(s);e.setDate(s.getDate()+1);B.push([s.toLocaleDateString('en',{weekday:'short'}),s,e])}}
 else{for(let i=11;i>=0;i--){B.push([new Date(n.getFullYear(),n.getMonth()-i,1).toLocaleDateString('en',{month:'short'}),new Date(n.getFullYear(),n.getMonth()-i,1),new Date(n.getFullYear(),n.getMonth()-i+1,1)])}}
 const D=B.map(([l,s,e])=>[l,view=='sold'?0:sum(sv,s,e),view=='saved'?0:sum(so,s,e)]);
 const mx=Math.max(1,...D.map(d=>d[1]+d[2]));
 $('chartTitle').textContent=span=='days'?'Last 7 days':'Last 12 months';
 $('chart').innerHTML=D.map(([l,a,b])=>`<div class="r"><span class="lb">${l}</span><div class="track"><div class="bs" style="width:${a/mx*100}%"></div><div class="bo" style="width:${b/mx*100}%"></div></div><span class="val">${f(a+b)}</span></div>`).join('');
 $('legend').style.display=view=='total'?'flex':'none';
 $('list').innerHTML=list.slice(0,50).map(r=>{const k=K(r),x=k=='sold'?(r.platform?' · '+esc(r.platform):''):(r.was_price?` · ${r.was_price} → ${r.now_price}`:'');
  return `<li onclick="del('${r.id}')"><span><i class="dot" style="background:var(--${k})"></i>${esc(r.note||'—')}<br><small>${new Date(r.created_at).toLocaleString('de-CH',{dateStyle:'short',timeStyle:'short'})}${x}</small></span><b style="color:var(--${k});white-space:nowrap">${r.currency} ${f(r.amount)}</b></li>`}).join('')||'<small>No entries yet</small>'}
if(view!='total')setKind(view);init();
</script></body></html>
